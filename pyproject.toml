[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clausecheck"
version = "0.4.0"
description = "Transparent, rule-based clause extraction and risk checks for AI and SaaS vendor contracts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Alexander Senderovitz", email = "alexander@senderovitz.eu"}]
dependencies = ["pyyaml>=6.0", "pypdf>=4.0", "python-docx>=1.1", "fpdf2>=2.8"]

[project.optional-dependencies]
app = ["streamlit>=1.50,<2"]
dev = ["pytest>=8", "streamlit>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clausecheck = ["rules/*.yaml", "fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
